<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Room | BridgeStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .session-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .timer { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--navy); }
  #jitsiContainer { width: 100%; height: 600px; background: #000; border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <h2>Session Room</h2>
      <div class="topbar-right" id="topbar-right" style="position:relative;"></div>
    </div>
    <div class="content">
      <div class="card">
        <div class="session-topbar">
          <div>
            <div style="font-weight:700; font-size:14px;" id="sessionWith">Loading user info...</div>
            <div class="meta" style="color:var(--text-muted); font-size:12.5px;">Video · Audio · Chat · Screen share — powered by Jitsi Meet, opens directly here.</div>
          </div>
          <div style="text-align:right;">
            <div class="timer" id="timerDisplay">00:00:00</div>
            <button class="btn btn-gold btn-sm" id="toggleBtn" style="margin-top:6px;">Start Session</button>
          </div>
        </div>
        <div id="jitsiContainer"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="platform.js?v=8000"></script>
<script src="https://meet.jit.si/external_api.js"></script>
<script>
(async function init() {
  // 1. Wait for authentication
  const user = await Auth.requireAuth(['student', 'mentor']);
  if (!user) return;

  await renderChrome(user, 'session.html');

  // 2. Setup Jitsi Room
  // We use a shared room name based on the mentor's ID so the student and mentor land in the same place.
  const roomName = user.role === 'mentor' 
    ? `BridgeStep_Room_${user.id}` 
    : `BridgeStep_Room_${user.mentorId || 'Unassigned'}`;

  const domain = 'meet.jit.si';
  const options = {
    roomName: roomName,
    width: '100%',
    height: 600,
    parentNode: document.querySelector('#jitsi-container'),
    userInfo: {
      displayName: user.name
    }
  };
  
  const api = new JitsiMeetExternalAPI(domain, options);

  // 3. Track Session Time
  let sessionStartTime = null;

  document.getElementById('startSessionBtn').addEventListener('click', () => {
    sessionStartTime = new Date();
    alert('Session timer started!');
  });

  document.getElementById('endSessionBtn').addEventListener('click', async () => {
    if (!sessionStartTime) {
      alert('You must start the session first.');
      return;
    }
    
    const endTime = new Date();
    const durationMinutes = Math.round((endTime - sessionStartTime) / 60000);
    
    // Create the session record
    const allSessions = await DB.read('sessions');
    allSessions.push({
      id: uid('sess'),
      mentorId: user.role === 'mentor' ? user.id : user.mentorId,
      studentId: user.role === 'student' ? user.id : null, // The admin or mentor will sync this later if needed
      start: sessionStartTime.toISOString(),
      durationMinutes: durationMinutes,
      status: 'completed'
    });
    await DB.write('sessions', allSessions);

    // Update user's total hours
    const allUsers = await DB.read('users');
    const userIndex = allUsers.findIndex(u => u.id === user.id);
    if (userIndex !== -1) {
      allUsers[userIndex].hoursTotal = (allUsers[userIndex].hoursTotal || 0) + (durationMinutes / 60);
      await DB.write('users', allUsers);
    }

    alert(`Session ended! Logged ${durationMinutes} minutes.`);
    window.location.href = user.role + '.html'; // redirect back to dashboard
  });
})();
</script>
</body>
</html>
