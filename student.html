<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | BridgeStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="topbar-right" id="topbar-right" style="position:relative;"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="certModal">
  <div class="modal-box" style="max-width:520px; text-align:center;">
    <div style="border:2px solid var(--gold); border-radius:12px; padding:34px 24px;">
      <div style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:10px;">Certificate of Completion</div>
      <h1 style="font-size:24px; margin-bottom:6px;" id="certName">—</h1>
      <p style="color:var(--text-muted); font-size:13.5px; margin-bottom:18px;">has successfully completed the BridgeStep Mentorship Program</p>
      <div style="font-size:12px; color:var(--text-muted);" id="certDate">—</div>
      <div style="margin-top:20px; font-family:'Fraunces',serif; font-size:15px; color:var(--navy);">🌉 BridgeStep Mentorship</div>
    </div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="document.getElementById('certModal').classList.remove('show')">Close</button>
      <button class="btn btn-navy" style="flex:1;" onclick="window.print()">Download as PDF</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="platform.js"></script>
<script src="platform.js?v=2000"></script>
<script>
(async function init() {
  const user = await Auth.requireAuth(['student']);
  if (!user) return;

  await renderChrome(user, 'student.html');

  const allUsers = await DB.read('users');
  const myMentor = allUsers.find(u => u.id === user.mentorId);

  const allSessions = await DB.read('sessions');
  const sessions = allSessions.filter(s => s.studentId === user.id).sort((a,b) => new Date(b.start) - new Date(a.start));
  const upcoming = sessions.filter(s => s.status === 'upcoming');
  const past = sessions.filter(s => s.status === 'completed');

  const announcements = await DB.read('announcements');

  function render() {
    document.getElementById('content').innerHTML = `
      <div class="grid grid-4" style="margin-bottom:18px;">
        <div class="card stat-card"><div class="num">${user.hoursTotal || 0}</div><div class="label">Completed Hours</div></div>
        <div class="card stat-card"><div class="num">${past.length}</div><div class="label">Sessions Attended</div></div>
        <div class="card stat-card"><div class="num">${upcoming.length}</div><div class="label">Upcoming Sessions</div></div>
        <div class="card stat-card"><div class="num">${(user.goals || []).length}</div><div class="label">Active Goals</div></div>
      </div>

      <div class="grid grid-2" style="margin-bottom:18px; align-items:start;">
        <div class="card">
          <h3>Your Mentor</h3>
          ${myMentor ? `
            <div class="list-row">
              <div class="who"><div class="avatar">${initials(myMentor.name)}</div><div><div style="font-weight:700;">${myMentor.name}</div><div class="meta">${myMentor.bio || 'Mentor'}</div></div></div>
              <a href="session.html" class="btn btn-navy btn-sm">Join Session Room</a>
            </div>
          ` : `<div class="empty-state">No mentor matched yet — our admin team is pairing you soon!</div>`}
        </div>

        <div class="card">
          <h3>Announcements</h3>
          ${announcements.length ? announcements.map(a => `
            <div class="list-row">
              <div class="who"><div><div style="font-size:13.5px;">${a.text}</div><div class="meta">${fmtDate(a.date)}</div></div></div>
            </div>
          `).join('') : `<div class="empty-state">No announcements.</div>`}
        </div>
      </div>

      <div class="grid grid-2" style="align-items:start;">
        <div class="card">
          <h3>Upcoming Sessions</h3>
          ${upcoming.length ? upcoming.map(s => `
            <div class="list-row">
              <div class="who"><div><div style="font-weight:700;">Session with ${myMentor ? myMentor.name : 'Mentor'}</div><div class="meta">${fmtDate(s.start)} · ${fmtTime(s.start)}</div></div></div>
              <a href="session.html" class="btn btn-gold btn-sm">Join Room</a>
            </div>
          `).join('') : `<div class="empty-state">No upcoming sessions scheduled.</div>`}
        </div>

        <div class="card">
          <h3>Session Notes & Feedback</h3>
          ${past.length ? past.map(s => `
            <div class="list-row" style="flex-direction:column; align-items:flex-start; gap:6px;">
              <div style="font-weight:700; font-size:13.5px;">${fmtDate(s.start)} (${s.durationMinutes} mins)</div>
              ${s.notes ? `
                <div class="meta"><strong>Summary:</strong> ${s.notes.summary || 'N/A'}</div>
                <div class="meta"><strong>Homework:</strong> ${s.notes.homework || 'N/A'}</div>
              ` : `<div class="meta">No notes recorded for this session.</div>`}
            </div>
          `).join('') : `<div class="empty-state">No past session records yet.</div>`}
        </div>
      </div>
    `;
  }
  render();
})();
</script>
</body>
</html>
