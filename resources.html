<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources & Messages | BridgeStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .chat-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; height: 320px; overflow-y: auto; background: #f8fafc; margin-bottom: 12px; }
  .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; font-size: 13.5px; line-height: 1.4; }
  .msg-me { background: #2563eb; color: #fff; margin-left: auto; text-align: right; border-bottom-right-radius: 2px; }
  .msg-them { background: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; margin-right: auto; border-bottom-left-radius: 2px; }
  .chat-input-row { display: flex; gap: 10px; }
  .chat-input-row input { flex: 1; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <h2>Resources & Messaging</h2>
      <div class="topbar-right" id="topbar-right" style="position:relative;"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="platform.js?v=19000"></script>
<script>
(async function init() {
  try {
    const user = await Auth.requireAuth(['student', 'mentor', 'admin']);
    if (!user) return;

    await renderChrome(user, 'resources.html');

    const rawResources = await DB.read('resources');
    const allUsers = await DB.read('users');
    const programs = await DB.read('programs');

    // 1. Sort resources by createdAt (newest first)
    const sortedResources = rawResources.sort((a, b) => {
      const dateA = a.createdAt ? new Date(a.createdAt) : new Date(0);
      const dateB = b.createdAt ? new Date(b.createdAt) : new Date(0);
      return dateB - dateA;
    });

    // 2. Filter resources based on role
    let displayResources = sortedResources;
    if (user.role === 'student') {
      // Students only see resources from their mentor or from an admin
      displayResources = sortedResources.filter(r => {
        const uploader = allUsers.find(u => u.id === r.uploadedBy);
        return r.uploadedBy === user.mentorId || (uploader && uploader.role === 'admin') || r.uploadedBy === 'admin';
      });
    } else if (user.role === 'mentor') {
      // Mentors only see their own resources or from an admin
      displayResources = sortedResources.filter(r => {
        const uploader = allUsers.find(u => u.id === r.uploadedBy);
        return r.uploadedBy === user.id || (uploader && uploader.role === 'admin') || r.uploadedBy === 'admin';
      });
    }
    // Admins see everything (no filter needed)

    let activeChatUser = null;
    if (user.role === 'student' && user.mentorId) {
      activeChatUser = allUsers.find(u => u.id === user.mentorId);
    } else if (user.role === 'mentor' && user.studentIds && user.studentIds.length) {
      activeChatUser = allUsers.find(u => u.id === user.studentIds[0]);
    }

    function render() {
      document.getElementById('content').innerHTML = `
        ${(user.role === 'mentor' || user.role === 'admin') ? `
          <div class="card" style="margin-bottom:18px;">
            <h3>Upload a New Resource</h3>
            <div class="grid grid-3">
              <div class="field"><label>Title</label><input id="resTitle" placeholder="e.g. Study Planner"></div>
              <div class="field"><label>Resource Link</label><input id="resUrl" type="url" placeholder="https://docs.google.com/..."></div>
              <div class="field"><label>Program</label>
                <select id="resProgram">
                  ${programs.length > 0 
                    ? programs.map(p => `<option>${p.name || p}</option>`).join('') 
                    : '<option>General</option><option>College Prep</option><option>STEM</option><option>English</option>'}
                </select>
              </div>
            </div>
            <button class="btn btn-navy btn-sm" id="uploadResBtn" style="margin-top: 10px;">Add Resource</button>
          </div>
        ` : ''}

        <div class="card" style="margin-bottom:18px;">
          <h3>Resource Library</h3>
          ${displayResources.length ? displayResources.map(r => {
            const uploader = allUsers.find(u => u.id === r.uploadedBy);
            const uploaderName = uploader ? uploader.name : 'Admin';
            
            // Allow delete if user is admin, or if user is the uploader
            const canDelete = (user.role === 'admin' || r.uploadedBy === user.id);

            return `
            <div class="list-row">
              <div class="who">
                <div class="avatar">📄</div>
                <div>
                  <div style="font-weight:700;">${r.title}</div>
                  <div class="meta">${r.program || 'General'} · Uploaded by ${r.uploadedBy === user.id ? 'You' : uploaderName}</div>
                </div>
              </div>
              <div style="display: flex; gap: 8px;">
                ${canDelete ? `<button class="btn btn-ghost btn-sm" style="color:#ef4444;" onclick="deleteResource('${r.id}')">Delete</button>` : ''}
                <a href="${r.url || '#'}" target="_blank" rel="noopener noreferrer" class="btn btn-navy btn-sm">Open Resource</a>
              </div>
            </div>
          `}).join('') : `<div class="empty-state">No resources uploaded yet.</div>`}
        </div>

        <div class="card">
          <h3>Direct Messages ${activeChatUser ? `with ${activeChatUser.name}` : ''}</h3>
          ${activeChatUser ? `
            <div class="chat-box" id="chatBox">Loading messages...</div>
            <div class="chat-input-row">
              <input id="chatInput" placeholder="Type a message..." />
              <button class="btn btn-navy btn-sm" id="sendMsgBtn">Send</button>
            </div>
          ` : `<div class="empty-state">You must be matched with a mentor/student to start messaging.</div>`}
        </div>
      `;
    }

    render();

    // Attach Delete Resource Function globally
    window.deleteResource = async function(resourceId) {
      if (!confirm("Are you sure you want to remove this resource?")) return;
      if (window.USE_FIREBASE) {
        await firebase.firestore().collection('resources').doc(resourceId).delete();
      }
      location.reload();
    };

    // Attach Upload Resource Event
    const uploadBtn = document.getElementById('uploadResBtn');
    if (uploadBtn) {
      uploadBtn.addEventListener('click', async () => {
        const titleInput = document.getElementById('resTitle');
        const urlInput = document.getElementById('resUrl');
        const title = titleInput.value.trim();
        let linkUrl = urlInput.value.trim();
        const programSelect = document.getElementById('resProgram');
        
        if(!title || !linkUrl) {
          alert('Please enter both a title and a valid resource link.');
          return;
        }

        if (!linkUrl.startsWith('http://') && !linkUrl.startsWith('https://')) {
          linkUrl = 'https://' + linkUrl;
        }

        await DB.addResource({
          title: title,
          type: 'Link',
          url: linkUrl,
          uploadedBy: user.id,
          program: programSelect ? programSelect.value : 'General',
          createdAt: nowISO()
        });

        if (user.role === 'mentor' && user.studentIds) {
          for (const sId of user.studentIds) {
            await Notif.add(sId, `New resource added: ${title}.`);
          }
        }

        titleInput.value = '';
        urlInput.value = '';
        alert('Resource added successfully!');
        location.reload();
      });
    }

    // Attach Chat Events
    if (activeChatUser) {
      async function loadChatMessages() {
        const chatBox = document.getElementById('chatBox');
        if (!chatBox) return;

        if (typeof DB.getMessages !== 'function') {
          chatBox.innerHTML = `<div class="empty-state">Messaging functions are updating... please hard refresh.</div>`;
          return;
        }

        const messages = await DB.getMessages(user.id, activeChatUser.id);

        if (!messages || !messages.length) {
          chatBox.innerHTML = `<div class="empty-state">No messages yet. Say hello!</div>`;
          return;
        }

        chatBox.innerHTML = messages.map(m => `
          <div class="msg-bubble ${m.fromId === user.id ? 'msg-me' : 'msg-them'}">
            <div>${m.text}</div>
            <div style="font-size:10px; opacity:0.7; margin-top:4px;">${fmtTime(m.ts)}</div>
          </div>
        `).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      await loadChatMessages();

      const sendBtn = document.getElementById('sendMsgBtn');
      if (sendBtn) {
        sendBtn.addEventListener('click', async () => {
          const input = document.getElementById('chatInput');
          const text = input.value.trim();
          if (!text) return;

          input.value = '';
          if (typeof DB.sendMessage === 'function') {
            await DB.sendMessage(user.id, activeChatUser.id, text);
            await Notif.add(activeChatUser.id, `New message from ${user.name}`);
            await loadChatMessages();
          }
        });
      }
    }
  } catch (err) {
    console.error("Initialization error on resources page:", err);
    document.getElementById('content').innerHTML = `<div class="card"><div class="empty-state">Unable to load resources. Check console for details.</div></div>`;
  }
})();
</script>
</body>
</html>
