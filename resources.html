<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources & Messages | BridgeStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <h2>Resources & Messages</h2>
      <div class="topbar-right" id="topbar-right" style="position:relative;"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="platform.js"></script>
<script src="platform.js?v=2000"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="platform.js?v=3000"></script>
<script>
(async function init() {
  const user = await Auth.requireAuth(['student', 'mentor', 'admin']);
  if (!user) return;

  await renderChrome(user, 'resources.html');

  const resources = await DB.read('resources');
  const programs = await DB.read('programs');

  function render() {
    document.getElementById('content').innerHTML = `
      ${(user.role === 'mentor' || user.role === 'admin') ? `
        <div class="card" style="margin-bottom:18px;">
          <h3>Add New Resource Link</h3>
          <div class="grid grid-2" style="margin-bottom:12px;">
            <div class="field"><label>Resource Title</label><input id="resTitle" placeholder="e.g. SAT Math Prep Checklist"></div>
            <div class="field"><label>Program / Category</label>
              <select id="resProgram">
                ${programs.map(p => `<option>${p.name || p}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-2" style="margin-bottom:12px;">
            <div class="field"><label>Resource URL (Google Drive / PDF / Doc link)</label><input id="resUrl" placeholder="https://drive.google.com/..."></div>
            <div class="field"><label>Format Type</label>
              <select id="resType">
                <option>PDF / Document</option>
                <option>Google Drive</option>
                <option>Video / Audio</option>
                <option>External Link</option>
              </select>
            </div>
          </div>
          <button class="btn btn-navy btn-sm" onclick="saveResource()">Save Resource</button>
        </div>
      ` : ''}

      <div class="card">
        <h3>Resource Library</h3>
        ${resources.length ? resources.map(r => `
          <div class="list-row">
            <div class="who">
              <div class="avatar">📄</div>
              <div>
                <div style="font-weight:700;">${r.title}</div>
                <div class="meta">${r.program} · Type: ${r.type || 'Link'}</div>
              </div>
            </div>
            <a href="${r.url || '#'}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm">Open Resource</a>
          </div>
        `).join('') : `<div class="empty-state">No resources available yet.</div>`}
      </div>
    `;
  }
  render();

  window.saveResource = async function() {
    const title = document.getElementById('resTitle').value.trim();
    const url = document.getElementById('resUrl').value.trim();
    const program = document.getElementById('resProgram').value;
    const type = document.getElementById('resType').value;

    if (!title || !url) {
      alert('Please enter both a title and a URL.');
      return;
    }

    await DB.addResource({
      title,
      url,
      program,
      type,
      uploadedBy: user.id,
      createdAt: nowISO()
    });

    alert('Resource link added successfully!');
    location.reload();
  };
})();
</script>
</body>
</html>
