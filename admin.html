<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | BridgeStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <h2>Admin Overview</h2>
      <div class="topbar-right" id="topbar-right" style="position:relative;"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="platform.js?v=15000"></script>
<script>
(async function init() {
  const user = await Auth.requireAuth(['admin']);
  if (!user) return;

  await renderChrome(user, 'admin.html');

  const allUsers = await DB.read('users');
  const allSessions = await DB.read('sessions');
  
  const pendingUsers = allUsers.filter(u => u.role !== 'admin' && u.status !== 'approved');
  // Strict filter: only users who are approved will show in the matching dropdowns
  const mentors = allUsers.filter(u => u.role === 'mentor' && u.status === 'approved');
  const students = allUsers.filter(u => u.role === 'student' && u.status === 'approved');
  
  const completedSessions = allSessions.filter(s => s.status === 'completed').length;
  const upcomingSessions = allSessions.filter(s => s.status === 'upcoming').length;

  function render() {
    document.getElementById('content').innerHTML = `
      <div class="grid grid-4" style="margin-bottom:18px;">
        <div class="card stat-card"><div class="num">${allUsers.length}</div><div class="label">Total Platform Users</div></div>
        <div class="card stat-card"><div class="num">${students.length}</div><div class="label">Active Students</div></div>
        <div class="card stat-card"><div class="num">${mentors.length}</div><div class="label">Active Mentors</div></div>
        <div class="card stat-card"><div class="num">${pendingUsers.length}</div><div class="label">Pending Applications</div></div>
      </div>

      <div class="card" style="margin-bottom:18px;">
        <h3>Platform Overview & Session Growth</h3>
        <div style="position: relative; width: 100%; height: 300px;">
          <canvas id="adminChart"></canvas>
        </div>  
      </div>

      <div class="card" style="margin-bottom:18px;">
        <h3>Pending User Approvals</h3>
        ${pendingUsers.length ? pendingUsers.map(u => `
          <div class="list-row">
            <div class="who"><div class="avatar">${initials(u.name)}</div><div><div style="font-weight:700;">${u.name} (${u.role})</div><div class="meta">${u.email} · Applied ${fmtDate(u.joinDate)}</div></div></div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-navy btn-sm" onclick="approveUser('${u.id}')">Approve</button>
            </div>
          </div>
        `).join('') : `<div class="empty-state">No pending applications right now.</div>`}
      </div>

      <div class="card">
        <h3>Match Student to Mentor</h3>
        <div class="grid grid-2" style="margin-bottom:12px;">
          <div class="field"><label>Select Student</label>
            <select id="matchStudent">
              ${students.length > 0 
                ? students.map(s => `<option value="${s.id}">${s.name} (${s.email})</option>`).join('') 
                : `<option value="">No approved students available</option>`}
            </select>
          </div>
          <div class="field"><label>Select Mentor</label>
            <select id="matchMentor">
              ${mentors.length > 0 
                ? mentors.map(m => `<option value="${m.id}">${m.name} (${m.email})</option>`).join('') 
                : `<option value="">No approved mentors available</option>`}
            </select>
          </div>
        </div>
        <button class="btn btn-gold btn-sm" onclick="assignMatch()">Confirm Match</button>
      </div>
    `;
  }
  
  render();

  const ctx = document.getElementById('adminChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Students', 'Mentors', 'Completed Sessions', 'Upcoming Sessions'],
      datasets: [{
        label: 'Platform Totals',
        data: [students.length, mentors.length, completedSessions, upcomingSessions],
        backgroundColor: ['#2563eb', '#059669', '#d97706', '#9333ea']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });

  window.approveUser = async function(userId) {
    if (window.USE_FIREBASE) {
      await firebase.firestore().collection('users').doc(userId).update({ status: 'approved' });
    } else {
      const freshUsers = await DB.read('users');
      const idx = freshUsers.findIndex(u => u.id === userId);
      if (idx !== -1) {
        freshUsers[idx].status = 'approved';
        await DB.write('users', freshUsers);
      }
    }
    await Notif.add(userId, 'Your BridgeStep application has been approved! Welcome aboard.');
    alert('User approved!');
    location.reload();
  };

  window.assignMatch = async function() {
    const studentSelect = document.getElementById('matchStudent');
    const mentorSelect = document.getElementById('matchMentor');

    if (!studentSelect || !mentorSelect) return;

    const studentId = studentSelect.value;
    const mentorId = mentorSelect.value;

    if (!studentId || !mentorId) {
      alert('You must have at least one approved student and one approved mentor to make a match.');
      return;
    }

    if (window.USE_FIREBASE) {
      // 1. Set the mentorId on the student's profile
      await firebase.firestore().collection('users').doc(studentId).update({ mentorId: mentorId });
      
      // 2. Add the studentId safely to the mentor's array of students using arrayUnion
      await firebase.firestore().collection('users').doc(mentorId).update({ 
        studentIds: firebase.firestore.FieldValue.arrayUnion(studentId) 
      });
    } else {
      const freshUsers = await DB.read('users');
      const stIdx = freshUsers.findIndex(u => u.id === studentId);
      const mtIdx = freshUsers.findIndex(u => u.id === mentorId);
      if (stIdx !== -1 && mtIdx !== -1) {
        freshUsers[stIdx].mentorId = mentorId;
        freshUsers[mtIdx].studentIds = freshUsers[mtIdx].studentIds || [];
        if (!freshUsers[mtIdx].studentIds.includes(studentId)) {
          freshUsers[mtIdx].studentIds.push(studentId);
        }
        await DB.write('users', freshUsers);
      }
    }

    const currentUsers = await DB.read('users');
    const studentDoc = currentUsers.find(u => u.id === studentId);
    const mentorDoc = currentUsers.find(u => u.id === mentorId);

    await Notif.add(studentId, `You have been paired with mentor ${mentorDoc.name}!`);
    await Notif.add(mentorId, `You have a new assigned student: ${studentDoc.name}.`);

    alert(`Successfully matched ${studentDoc.name} with ${mentorDoc.name}!`);
    location.reload();
  };
})();
</script>
</body>
</html>
